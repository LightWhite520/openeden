ktor:
  deployment:
    port: "$OPENEDEN_SERVER_PORT:8080"
  application:
    modules:
      - io.openeden.server.api.plugin.SerializationKt.configureSerialization
      - io.openeden.server.api.route.WebsocketsKt.configureWebsockets
      - io.openeden.server.api.plugin.StatusPagesKt.configureStatusPages
      - io.openeden.server.bootstrap.RuntimeKt.configureRuntime
      - io.openeden.server.api.route.OneBotModuleKt.configureOneBot
      - io.openeden.server.api.route.RoutingKt.configureRouting

openeden:
  llm:
    apiKey: "$OPENEDEN_OPENAI_API_KEY:replace-with-your-api-key"
    model: "$OPENEDEN_OPENAI_MODEL:gpt-5.6-luna"
    baseUrl: "$OPENEDEN_OPENAI_BASE_URL:https://api.openai.com/v1"
    promptCachingMode: "$OPENEDEN_OPENAI_PROMPT_CACHING_MODE:auto"
    capabilityProbe:
      enabled: "$OPENEDEN_OPENAI_CAPABILITY_PROBE_ENABLED:false"
      routingFingerprint: "$OPENEDEN_OPENAI_ROUTING_FINGERPRINT:default"
      ttlSeconds: "$OPENEDEN_OPENAI_CAPABILITY_PROBE_TTL_SECONDS:900"
    reasoningEffort: "$OPENEDEN_LLM_REASONING_EFFORT:medium"
    temperatureMin: "$OPENEDEN_LLM_TEMPERATURE_MIN:0.2"
    temperatureMax: "$OPENEDEN_LLM_TEMPERATURE_MAX:1.0"
    maxOutputTokens: "$?OPENEDEN_LLM_MAX_OUTPUT_TOKENS"
  runtime:
    personaPath: "$OPENEDEN_PERSONA_PATH:persona/atri.yaml"
    databasePath: "$OPENEDEN_RUNTIME_DB_PATH:data/runtime/openeden.db"
    localModelArtifact: "$OPENEDEN_LOCAL_MODEL_ARTIFACT:data/models/local-model-artifact.json"
    modelBackend: "$OPENEDEN_MODEL_BACKEND:djl"
    djlVqVaeModelPath: "$OPENEDEN_DJL_VQVAE_MODEL_PATH:data/models/djl/vqvae"
    djlTextModelPath: "$OPENEDEN_DJL_TEXT_MODEL_PATH:data/models/djl/text"
    djlEmotionalModelPath: "$OPENEDEN_DJL_EMOTIONAL_MODEL_PATH:data/models/djl/emotional"
    djlAffectModelPath: "$OPENEDEN_DJL_AFFECT_MODEL_PATH:data/models/thymos-6d"
    djlEngine: "$OPENEDEN_DJL_ENGINE:PyTorch"
    djlModelName: "$OPENEDEN_DJL_MODEL_NAME:model"
  vectorDatabase:
    enabled: "$OPENEDEN_VECTOR_DB_ENABLED:true"
    url: "$OPENEDEN_QDRANT_URL:http://localhost:6333"
    apiKey: "$OPENEDEN_QDRANT_API_KEY:"
    collectionPrefix: "$OPENEDEN_QDRANT_COLLECTION:openeden_memory"
    modelId: "$OPENEDEN_EMBEDDING_MODEL_ID:local-v1"
    requestTimeoutMs: "$OPENEDEN_QDRANT_TIMEOUT_MS:2000"
    syncIntervalSeconds: "$OPENEDEN_QDRANT_SYNC_INTERVAL_SECONDS:30"
    syncBatchSize: "$OPENEDEN_QDRANT_SYNC_BATCH_SIZE:128"
    failureThreshold: "$OPENEDEN_QDRANT_FAILURE_THRESHOLD:3"
  heartbeat:
    ownerPlatform: "$?OPENEDEN_OWNER_PLATFORM"
    ownerUserId: "$?OPENEDEN_OWNER_USER_ID"
  onebot:
    enabled: "$OPENEDEN_ONEBOT_ENABLED:false"
    path: "$OPENEDEN_ONEBOT_PATH:/onebot/v11"
    accessToken: "$OPENEDEN_ONEBOT_ACCESS_TOKEN:"
    botSelfId: "$OPENEDEN_ONEBOT_BOT_SELF_ID:"
    groupPolicy: "$OPENEDEN_ONEBOT_GROUP_POLICY:MENTION_ONLY"
    eventQueueCapacity: "$OPENEDEN_ONEBOT_EVENT_QUEUE_CAPACITY:64"
    eventWorkers: "$OPENEDEN_ONEBOT_EVENT_WORKERS:4"
    actionTimeoutMs: "$OPENEDEN_ONEBOT_ACTION_TIMEOUT_MS:10000"
    maxActionRetries: "$OPENEDEN_ONEBOT_MAX_ACTION_RETRIES:2"
  relationship:
    hostPlatform: "$?OPENEDEN_HOST_PLATFORM"
    hostUserId: "$?OPENEDEN_HOST_USER_ID"
    hostAddress: "$?OPENEDEN_HOST_ADDRESS"
  diary:
    deltaThreshold: "$OPENEDEN_DIARY_DELTA_THRESHOLD:0.25"
    elapsedHours: "$OPENEDEN_DIARY_ELAPSED_HOURS:5"
    scanIntervalSeconds: "$OPENEDEN_DIARY_SCAN_INTERVAL_SECONDS:60"
    maxRawMemories: "$OPENEDEN_DIARY_MAX_RAW_MEMORIES:32"
  diagnostics:
    enabled: "$OPENEDEN_ENABLE_CLI_DIAGNOSTICS:false"
    token: "$?OPENEDEN_CLI_DIAGNOSTICS_TOKEN"
